<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes flowDash {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes shimmerGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }

      .animated-stream-1 {
        stroke-dasharray: 8 12;
        animation: flowDash 2.5s linear infinite;
      }
      .animated-stream-2 {
        stroke-dasharray: 6 10;
        animation: flowDash 2s linear infinite reverse;
      }
      .animated-stream-3 {
        stroke-dasharray: 10 14;
        animation: flowDash 3s linear infinite;
      }
      .glow-shimmer {
        animation: shimmerGlow 4s ease-in-out infinite;
      }
      .floating-particle-1 {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .floating-particle-2 {
        animation: floatParticle 4s ease-in-out infinite 1.5s;
      }
      .floating-particle-3 {
        animation: floatParticle 6s ease-in-out infinite 0.7s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
  </g>

  <!-- Cyber Glow Ambient Orbs (Behind content) -->
  <circle cx="220" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowPurple)" class="glow-shimmer" />
  <circle cx="980" cy="110" r="160" fill="#a855f7" opacity="0.14" filter="url(#glowPurple)" class="glow-shimmer" />
  <circle cx="600" cy="350" r="130" fill="#06b6d4" opacity="0.1" filter="url(#glowCyan)" class="glow-shimmer" />

  <!-- Dynamic Animated ETL Pipeline Streamlines (Background / Midground) -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream 1: Source to Stage -->
    <path d="M 60 330 C 220 330, 260 270, 420 270" stroke="#0ea5e9" stroke-width="2.5" opacity="0.75" class="animated-stream-1" />
    <!-- Stream 2: CDC Real-time bypass -->
    <path d="M 60 360 C 280 360, 380 310, 600 310" stroke="#8b5cf6" stroke-width="2" opacity="0.65" class="animated-stream-2" />
    <!-- Stream 3: Transformation to Lakehouse -->
    <path d="M 420 270 C 580 270, 680 330, 840 330" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" class="animated-stream-1" />
    <!-- Stream 4: Orchestration pipeline -->
    <path d="M 600 310 C 760 310, 880 260, 1140 260" stroke="#10b981" stroke-width="2" opacity="0.7" class="animated-stream-3" />
    <!-- Stream 5: Lakehouse exit -->
    <path d="M 840 330 C 960 330, 1020 350, 1140 350" stroke="#c084fc" stroke-width="2" opacity="0.6" class="animated-stream-2" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="160" cy="290" r="3.5" fill="#38bdf8" class="floating-particle-1" />
  <circle cx="340" cy="250" r="4" fill="#a855f7" class="floating-particle-2" />
  <circle cx="510" cy="300" r="3" fill="#34d399" class="floating-particle-3" />
  <circle cx="720" cy="280" r="4.5" fill="#38bdf8" class="floating-particle-1" />
  <circle cx="940" cy="315" r="3.5" fill="#c084fc" class="floating-particle-2" />
  <circle cx="1060" cy="270" r="4" fill="#38bdf8" class="floating-particle-3" />

  <!-- Pipeline Architecture Interactive Node Badges (Midground, below title) -->
  <g transform="translate(60, 245)">
    <!-- Node 1: Sources -->
    <g transform="translate(0, 45)">
      <rect width="130" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#38bdf8" />
      <text x="32" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SOURCES / CDC</text>
    </g>

    <!-- Node 2: Ingest & Extract -->
    <g transform="translate(260, 10)">
      <rect width="140" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#818cf8" />
      <text x="32" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">INGEST / ELT</text>
    </g>

    <!-- Node 3: Transform & Orchestrate -->
    <g transform="translate(540, 50)">
      <rect width="165" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#a855f7" />
      <text x="32" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ORCHESTRATION</text>
    </g>

    <!-- Node 4: Lakehouse & DW -->
    <g transform="translate(820, 15)">
      <rect width="150" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#34d399" />
      <text x="32" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LAKEHOUSE / DW</text>
    </g>
  </g>

  <!-- FOREGROUND: Header Content (Always crisp, prominent, high contrast) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 48)">
      <rect width="260" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ENTERPRISE DATA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Enterprise ETL Integration
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated Landscape of Enterprise SaaS Platforms, Open-Source Pipelines, CDC &amp; Orchestration
    </text>

    <!-- Technology Tags / Micro Badges Row -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ETL / ELT</text>

      <!-- Tag 2 -->
      <rect x="80" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="92" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Real-Time CDC</text>

      <!-- Tag 3 -->
      <rect x="195" y="0" width="135" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="207" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DAG Orchestration</text>

      <!-- Tag 4 -->
      <rect x="340" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="352" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Cloud Lakehouse</text>

      <!-- Tag 5 -->
      <rect x="465" y="0" width="130" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="477" y="16" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Reverse ETL &amp; APIs</text>
    </g>
  </g>

  <!-- Sleek Border Highlight -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
